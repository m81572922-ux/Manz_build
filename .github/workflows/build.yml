
name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Release'
        required: true
        type: string
      mode:
        description: 'Mode Build'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Release ZIP
        run: |
          gh release download ${{ github.event.inputs.tag }} -D ./project_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Project
        run: |
          cd ./project_source
          unzip *.zip -d ../extracted_project
          cd ..
          
      - name: Find Project Folder
        id: find_dir
        run: |
          PROJECT_DIR=$(find extracted_project -name pubspec.yaml -exec dirname {} \; | head -n 1)
          echo "FOLDER_TARGET=$PROJECT_DIR" >> $GITHUB_ENV
          
      - name: Patch Gradle Version
        working-directory: ${{ env.FOLDER_TARGET }}
        run: |
          # Ini yang nembak ke services.gradle.org biar gak 404
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Get Dependencies
        working-directory: ${{ env.FOLDER_TARGET }}
        run: flutter pub get
        
      - name: Build APK
        working-directory: ${{ env.FOLDER_TARGET }}
        run: flutter build apk --${{ github.event.inputs.mode }}
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: ${{ env.FOLDER_TARGET }}/build/app/outputs/flutter-apk/app-*.apk
