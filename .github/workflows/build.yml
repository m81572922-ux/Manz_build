name: Universal Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Release ZIP'
        required: true
        type: string
      mode:
        description: 'Mode Build'
        required: true
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Release ZIP
        run: |
          gh release download ${{ github.event.inputs.tag }} -D ./project_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Project & Find Path
        id: find_dir
        run: |
          cd ./project_source
          unzip *.zip -d ../extracted_project
          cd ..
          # Cari file pubspec.yaml buat nentuin folder utama
          PROJECT_DIR=$(find extracted_project -name pubspec.yaml -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ PUBSPEC.YAML TIDAK DITEMUKAN! ZIP lu salah struktur."
            exit 1
          fi
          echo "FOLDER_TARGET=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Target folder: $PROJECT_DIR"

      - name: Auto-Patch Base (Anti Gagal)
        working-directory: ${{ env.FOLDER_TARGET }}
        run: |
          echo "🔧 Memulai Auto-Patch untuk Base..."
          
          # 1. Hapus error Icon di AndroidManifest
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:icon="@mipmap\/ic_launcher"//g' android/app/src/main/AndroidManifest.xml
            sed -i 's/android:icon="@drawable\/launch_background"//g' android/app/src/main/AndroidManifest.xml
          fi

          # 2. Paksa Gradle Wrapper ke versi 8.4 (Stabil untuk semua base)
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 3. Paksa Android SDK & Namespace (Biar base jadul gak error pas di-build Flutter baru)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
            # Tambahin namespace kalau belum ada
            if ! grep -q "namespace " android/app/build.gradle; then
              PKG_NAME=$(grep "package=" android/app/src/main/AndroidManifest.xml | sed 's/.*package="\([^"]*\)".*/\1/')
              if [ -n "$PKG_NAME" ]; then
                sed -i "/android {/a \    namespace \"$PKG_NAME\"" android/app/build.gradle
              fi
            fi
          fi
          
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts
          fi

          # 4. Tambahin Jetifier (Wajib buat base jadul AndroidX)
          if [ -f "android/gradle.properties" ]; then
            echo "android.enableJetifier=true" >> android/gradle.properties
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi
          echo "✅ Auto-Patch Selesai!"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: actions/setup-flutter@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies (Flutter Pub Get)
        working-directory: ${{ env.FOLDER_TARGET }}
        run: |
          # Coba pub get biasa
          flutter pub get
          
      - name: Build APK
        working-directory: ${{ env.FOLDER_TARGET }}
        run: |
          # Build APK mode release
          flutter build apk --${{ github.event.inputs.mode }}
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-result
          path: ${{ env.FOLDER_TARGET }}/build/app/outputs/flutter-apk/app-*.apk
